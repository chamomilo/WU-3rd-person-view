classname=org.wuthirdpersonview.client.WUThirdPersonViewMod
classpath=WU-third_person_view.jar
sharedClassLoader=true
version=0.2.3

# Camera profile
enabled=true
defaultZoom=0.32
zoomStep=0.08
# Enforced minimum keeps the camera behind character and helmet meshes.
minDistance=1.20
maxDistance=12.0
# Added to Wurm's native eye/head height. Keep at zero for WO-style centering.
headAnchorVerticalOffset=0.0
# Animate the visible head from native look input. While standing, the body
# follows only after the head reaches its yaw limit; movement recentres it.
animateHead=true
maxHeadYawDegrees=55.0
maxHeadPitchDegrees=60.0
bodyFollowSeconds=0.12

# Smoothing and collision
zoomSmoothingSeconds=0.10
collisionReturnSeconds=0.28
cameraRadius=0.24
collisionMargin=0.10
# Final camera centre is never allowed below the active surface plus this gap.
surfaceClearance=0.25
firstPersonEnterDistance=1.00
firstPersonExitDistance=1.15

# Orbit mode
orbitKey=LSHIFT
orbitSensitivity=1.0
orbitReturns=true
orbitReturnSeconds=0.45
maxOrbitPitchDegrees=35.0

# Input: auto cooperates with Keybinder and falls back to native wheel input.
inputProvider=auto
debug=false
