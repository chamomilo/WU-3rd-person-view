apply plugin: 'java'

group = 'org.wuthirdpersonview'
version = '0.4.9'

sourceCompatibility = 1.8
targetCompatibility = 1.8

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    def clientLibraries = [
            'libs/client-patched.jar',
            'libs/common.jar',
            'libs/javassist.jar',
            'libs/modlauncher.jar'
    ]
    clientLibraries.each { library ->
        if (!file(library).isFile()) {
            throw new GradleException("Required pinned client library is missing: ${library}")
        }
    }
    compile files(clientLibraries)
    testCompile files('libs/junit-4.13.2.jar', 'libs/hamcrest-core-1.3.jar')
}

jar {
    archiveName "${project.name}.jar"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    into('META-INF') {
        from('LICENSE') { rename { 'LICENSE.txt' } }
    }
}

task verifyClientContract(type: Test) {
    include '**/PinnedClientContractTest.class'
}

task dist(type: Zip, dependsOn: [test, jar]) {
    into('mods') {
        from('mods/WU-third_person_view.properties')
        into(project.name) {
            from jar
            from 'README.txt'
            into('keybinder') {
                from 'src/main/resources/keybinder'
                include '*.keybinder'
            }
        }
    }
    archiveName "${project.name}-${project.version}.zip"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

task verifyDistArchive(dependsOn: dist) {
    doLast {
        def archive = zipTree(dist.archivePath)
        def expectedFiles = [
                "mods/${project.name}.properties",
                "mods/${project.name}/${project.name}.jar",
                "mods/${project.name}/keybinder/WU-third_person_view.keybinder",
                "mods/${project.name}/README.txt"
        ] as Set
        def actualFiles = [] as Set
        archive.visit { entry ->
            if (!entry.directory) actualFiles.add(entry.relativePath.pathString)
        }
        if (actualFiles != expectedFiles)
            throw new GradleException('Distribution file set differs: missing ' +
                    (expectedFiles - actualFiles) + ', unexpected ' + (actualFiles - expectedFiles))
        archive.matching { include '**/*.jar' }.each { packagedJar ->
            def nested = new java.util.zip.ZipFile(packagedJar)
            try {
                if (!nested.getEntry('META-INF/LICENSE.txt'))
                    throw new GradleException('Packaged JAR must contain the complete mod license')
                java.util.Collections.list(nested.entries()).each { entry ->
                    if (!entry.directory && entry.name.toLowerCase(java.util.Locale.ROOT).endsWith('.md')) {
                        throw new GradleException('Markdown must not be included in a packaged JAR: ' + entry.name)
                    }
                }
            } finally { nested.close() }
        }
        def packagedReadme = archive.matching {
            include "mods/${project.name}/README.txt"
        }.singleFile
        if (packagedReadme.getText('UTF-8') != file('README.txt').getText('UTF-8')) {
            throw new GradleException('Packaged README.txt differs from the installation guide')
        }
        if (!packagedReadme.getText('UTF-8').startsWith('Third Person View ' + project.version + '\n'))
            throw new GradleException('README.txt version differs from distribution')
        def packagedProperties = archive.matching {
            include "mods/${project.name}.properties"
        }.singleFile.getText('UTF-8')
        if (!(packagedProperties =~ /(?m)^classpath=${project.name}\.jar$/).find()) {
            throw new GradleException('Mod classpath must be relative to its own directory')
        }
    }
}

build.dependsOn verifyDistArchive

tasks.withType(Test) {
    dependsOn jar
    systemProperty 'thirdPersonView.modJar', jar.archivePath.absolutePath
}

test {
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

ext.chamomiloUpdate = [id: 'wu-third-person-view', name: 'Third Person View', repo: 'chamomilo/WU-3rd-person-view', asset: 'WU-third_person_view-{version}.zip', properties: 'mods/WU-third_person_view.properties', main: 'src/main/java/org/wuthirdpersonview/client/WUThirdPersonViewMod.java']
apply from: 'gradle/chamomilo-updater.gradle'
